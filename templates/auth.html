{% extends "base.html" %}{% block title %}Account | TravelMate{% endblock %}{% block content %}<section class="form-page"><h1>{{ 'Create account' if mode=='register' else 'Sign in' }}</h1>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form class="site-form" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Email<input type="email" name="email" required maxlength="254"></label><label>Password<input type="password" name="password" minlength="{{ 10 if mode=='register' else 1 }}" maxlength="128" required></label><button class="button button-teal">{{ 'Register' if mode=='register' else 'Sign in' }}</button></form><p><a href="{{ url_for('travel.register' if mode=='login' else 'travel.login') }}">{{ 'Create account' if mode=='login' else 'Sign in' }}</a></p></section>{% endblock %}
