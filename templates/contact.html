{% extends "base.html" %}{% block title %}Contact TravelMate{% endblock %}{% block content %}<section class="form-page"><h1>Contact</h1><p>Email placeholder: hello@travelmate.example · Phone placeholder: not configured.</p>{% if sent %}<p role="status">Enquiry saved.</p>{% endif %}{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form class="site-form" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Name<input name="name" value="{{ form.name }}" maxlength="100" required></label><label>Email<input type="email" name="email" value="{{ form.email }}" required></label><label>Subject<input name="subject" value="{{ form.subject }}" maxlength="120" required></label><label>Message<textarea name="message" maxlength="4000" required>{{ form.message }}</textarea></label><button class="button button-teal">Send</button></form></section>{% endblock %}
